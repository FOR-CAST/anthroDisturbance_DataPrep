## Render this module's manual (anthroDisturbance_DataPrep.Rmd -> .md, github_document)
## and commit the result. Rendering only needs SpaDES.core + rmarkdown + knitr (+ pandoc):
## the manual's chunks parse the module metadata, they do NOT run the module, so the
## module's reqdPkgs are not required. This avoids the old (broken) Require/full-SpaDES
## install path. Runs on pushes to `main` that touch the manual or module source.
name: Render module Rmd

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-module-rmd.yaml
      - anthroDisturbance_DataPrep.Rmd
      - anthroDisturbance_DataPrep.R
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    name: Render module Rmd
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          ## PredictiveEcology dev packages break often -- pin exact SHAs to match
          ## YT_caribou renv.lock (bump these in sync with the project lockfile).
          packages: |
            any::rmarkdown
            any::knitr
            github::PredictiveEcology/Require@d6e3df6f63026d3b1047f2ca28632685553521b4
            github::PredictiveEcology/quickPlot@a49fab61de547aaffd7f8fb5629571f88b4022f9
            github::PredictiveEcology/reproducible@b56c3003823a3bf5bd129dc1ebcdccb64c339589
            github::PredictiveEcology/SpaDES.core@a21acb0493692ea305560893702b2401d01da8ee

      - name: Render manual
        run: rmarkdown::render("anthroDisturbance_DataPrep.Rmd", encoding = "UTF-8")
        shell: Rscript {0}

      - name: Commit rendered manual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anthroDisturbance_DataPrep.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Re-build anthroDisturbance_DataPrep.md [skip-ci]"
            git push
          fi
