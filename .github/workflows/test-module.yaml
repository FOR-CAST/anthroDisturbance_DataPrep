## Run this module's unit tests (tests/testthat) with tests/run-tests.R. The tests source the helpers
## in R/ and mock their downloads and uploads, so only the packages those helpers and tests call are
## installed: not SpaDES.core, and not the module's full reqdPkgs. reproducible is pinned to the SHA
## in YT_caribou's renv.lock (bump it in sync with the project lockfile).
name: Module tests

on:
  push:
    branches:
      - main
      - development
    paths:
      - .github/workflows/test-module.yaml
      - R/**
      - tests/**
  pull_request:
    branches:
      - main
      - development
    paths:
      - .github/workflows/test-module.yaml
      - R/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Module tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::mockery
            any::withr
            any::data.table
            any::terra
            any::sf
            any::googledrive
            any::crayon
            any::digest
            any::tictoc
            any::fasterize
            github::PredictiveEcology/reproducible@b56c3003823a3bf5bd129dc1ebcdccb64c339589
            github::FOR-CAST/anthroDisturbanceUtils@7c846be45c7cd5cea48b233cd8c21fa45a3610a3

      - name: Run tests
        run: Rscript tests/run-tests.R
        env:
          ## at most 2 cores, as CRAN asks (tests/run-tests.R also enforces it)
          OMP_THREAD_LIMIT: 2
          OMP_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 2
          MKL_NUM_THREADS: 2
